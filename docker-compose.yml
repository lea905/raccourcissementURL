services:
  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - myanapro-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - myanapro-network

  nodejs:
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    # Keeps the container running so we can exec into it or run commands via compose
    command: tail -f /dev/null
    networks:
      - myanapro-network

networks:
  myanapro-network:
    driver: bridge
